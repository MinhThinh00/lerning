# Apps — profile: apps
#
# Image build bằng Jib (JHipster): trong thư mục service
#   ./mvnw -Pprod verify jib:build -Djib.to.image=${REGISTRY}/<service> -Djib.to.tags=<git-sha>
#
# Tag: KHÔNG dùng latest. Mỗi service 1 biến <SERVICE>_TAG trong .env (mặc định APP_TAG)
# → deploy/rollback từng service độc lập: đổi tag rồi `docker compose up -d <service>`
#
# Nguyên tắc để scale được (docker compose up -d --scale inventory-service=3):
#   - KHÔNG container_name, KHÔNG publish port (trừ gateway) → nhiều replica không đụng nhau
#   - Mọi địa chỉ là tên service DNS (mysql, kafka, consul...) — không localhost
#   - Mọi config qua env var → lên K8s chỉ chuyển thành ConfigMap/Secret
#   - Log JSON ra stdout, metric qua label, trace qua OTLP → không cần sửa khi thêm replica
#   - Healthcheck = readiness probe của Spring Boot (giống readinessProbe trên K8s)

x-app: &app
  restart: unless-stopped
  profiles: [apps]
  stop_grace_period: 30s
  env_file:
    # Topology Redis: env/redis-single.env hoặc env/redis-sentinel.env
    - env/redis-${REDIS_MODE:-single}.env
  depends_on:
    mysql: { condition: service_healthy }
    keycloak: { condition: service_healthy }
    consul: { condition: service_healthy }
  deploy:
    resources:
      limits:
        memory: 768M

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s

  # Discovery
  SPRING_CLOUD_CONSUL_HOST: consul
  SPRING_CLOUD_CONSUL_PORT: 8500
  SPRING_CLOUD_CONSUL_CONFIG_ENABLED: "false"     # config đi qua env, không qua Consul KV

  # Security (issuer phải giống URL người dùng lấy token → xem docs/03-SECURITY.md)
  SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: ${KEYCLOAK_URL}/realms/shop
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: shop-service
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: ${SHOP_SERVICE_CLIENT_SECRET}
  JHIPSTER_SECURITY_OAUTH2_AUDIENCE: shop-service

  # Kafka / Redis
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Observability
  JHIPSTER_LOGGING_USE_JSON_FORMAT: "true"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://apm-server:8200/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

x-app-labels: &app-labels
  prometheus.io/scrape: "true"
  prometheus.io/path: /management/prometheus
  co.elastic.logs/enabled: "true"

services:

  gateway:
    <<: *app
    image: ${REGISTRY:-shop}/gateway:${GATEWAY_TAG:-${APP_TAG:?set APP_TAG in .env}}
    environment:
      <<: *app-env
      SERVER_PORT: 8080
    labels:
      <<: *app-labels
      prometheus.io/port: "8080"
    # Gateway là cửa vào duy nhất được publish ra ngoài
    ports:
      - "${PUBLIC_BIND_ADDR:-0.0.0.0}:8080:8080"
    depends_on:
      keycloak: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck: &hc
      test: ["CMD-SHELL", "curl -sf http://localhost:$${SERVER_PORT}/management/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  user-service:
    <<: *app
    image: ${REGISTRY:-shop}/user-service:${USER_SERVICE_TAG:-${APP_TAG:?set APP_TAG in .env}}
    environment:
      <<: *app-env
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: &db-user jdbc:mysql://mysql:3306/db_user?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_LIQUIBASE_URL: *db-user
      SPRING_DATASOURCE_USERNAME: user_svc
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_USER}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_URL}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${SHOP_SERVICE_CLIENT_SECRET}
    labels:
      <<: *app-labels
      prometheus.io/port: "8081"
    healthcheck: *hc

  product-service:
    <<: *app
    image: ${REGISTRY:-shop}/product-service:${PRODUCT_SERVICE_TAG:-${APP_TAG:?set APP_TAG in .env}}
    environment:
      <<: *app-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: &db-product jdbc:mysql://mysql:3306/db_product?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_LIQUIBASE_URL: *db-product
      SPRING_DATASOURCE_USERNAME: product_svc
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_PRODUCT}
    labels:
      <<: *app-labels
      prometheus.io/port: "8082"
    healthcheck: *hc

  inventory-service:
    <<: *app
    image: ${REGISTRY:-shop}/inventory-service:${INVENTORY_SERVICE_TAG:-${APP_TAG:?set APP_TAG in .env}}
    environment:
      <<: *app-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: &db-inventory jdbc:mysql://mysql:3306/db_inventory?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=innodb_lock_wait_timeout=3
      SPRING_LIQUIBASE_URL: *db-inventory
      SPRING_DATASOURCE_USERNAME: inventory_svc
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_INVENTORY}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      INVENTORY_RESERVE_DEFAULT_STRATEGY: L5
    labels:
      <<: *app-labels
      prometheus.io/port: "8083"
    healthcheck: *hc

  order-service:
    <<: *app
    image: ${REGISTRY:-shop}/order-service:${ORDER_SERVICE_TAG:-${APP_TAG:?set APP_TAG in .env}}
    environment:
      <<: *app-env
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: &db-order jdbc:mysql://mysql:3306/db_order?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_LIQUIBASE_URL: *db-order
      SPRING_DATASOURCE_USERNAME: order_svc
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_ORDER}
    labels:
      <<: *app-labels
      prometheus.io/port: "8084"
    healthcheck: *hc

  payment-service:
    <<: *app
    image: ${REGISTRY:-shop}/payment-service:${PAYMENT_SERVICE_TAG:-${APP_TAG:?set APP_TAG in .env}}
    environment:
      <<: *app-env
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: &db-payment jdbc:mysql://mysql:3306/db_payment?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_LIQUIBASE_URL: *db-payment
      SPRING_DATASOURCE_USERNAME: payment_svc
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_PAYMENT}
      # Mock payment: tỉ lệ thành công (0.0 - 1.0)
      PAYMENT_MOCK_SUCCESS_RATE: "0.9"
    labels:
      <<: *app-labels
      prometheus.io/port: "8085"
    healthcheck: *hc

  notification-service:
    <<: *app
    image: ${REGISTRY:-shop}/notification-service:${NOTIFICATION_SERVICE_TAG:-${APP_TAG:?set APP_TAG in .env}}
    environment:
      <<: *app-env
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: &db-notification jdbc:mysql://mysql:3306/db_notification?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_LIQUIBASE_URL: *db-notification
      SPRING_DATASOURCE_USERNAME: notification_svc
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_NOTIFICATION}
    labels:
      <<: *app-labels
      prometheus.io/port: "8086"
    healthcheck: *hc
