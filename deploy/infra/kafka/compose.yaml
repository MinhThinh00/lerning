# Kafka (KRaft, không Zookeeper) — 2 chế độ, chọn qua profile:
#
#   kafka-single  : 1 node (broker+controller). Dev và server đơn. RF=1.
#   kafka-cluster : 3 node. LAB để học replication/ISR/leader election. RF=3.
#
# Listener:
#   INTERNAL  kafka:29092         → container trong network (apps, kafka-ui, exporter)
#   EXTERNAL  localhost:9092      → app chạy từ IDE trên host
#   CONTROLLER                    → KRaft quorum (nội bộ)
#
# Topic được tạo bởi job one-shot (kafka-init) — giống Job trong K8s.
# KHÔNG tạo topic từ code (NewTopic bean) để tránh 2 nguồn sự thật.

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.7.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 30s
  deploy:
    resources:
      limits:
        memory: 1G

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set in .env}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  KAFKA_LOG_DIRS: /var/lib/kafka/data

x-kafka-init: &kafka-init
  image: confluentinc/cp-kafka:7.7.0
  restart: "no"
  entrypoint: ["bash", "/scripts/topics.sh"]
  volumes:
    - ./topics.sh:/scripts/topics.sh:ro

services:

  # ═══ Profile: kafka-single ═══════════════════════════════
  kafka:
    <<: *kafka-common
    profiles: [kafka-single]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9092:9092"

  kafka-init:
    <<: *kafka-init
    profiles: [kafka-single]
    environment:
      BOOTSTRAP: kafka:29092
      REPLICATION_FACTOR: 1
      PARTITIONS: ${KAFKA_PARTITIONS:-3}
    depends_on:
      kafka:
        condition: service_healthy

  # ═══ Profile: kafka-cluster ══════════════════════════════
  kafka-1:
    <<: *kafka-common
    profiles: [kafka-cluster]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: &voters 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9092:9092"

  kafka-2:
    <<: *kafka-common
    profiles: [kafka-cluster]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: *voters
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9093:9093"

  kafka-3:
    <<: *kafka-common
    profiles: [kafka-cluster]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: *voters
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9094:9094"

  kafka-cluster-init:
    <<: *kafka-init
    profiles: [kafka-cluster]
    environment:
      BOOTSTRAP: kafka-1:29092,kafka-2:29092,kafka-3:29092
      REPLICATION_FACTOR: 3
      PARTITIONS: ${KAFKA_PARTITIONS:-3}
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  # ═══ Profile: tools ══════════════════════════════════════
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    profiles: [tools]
    environment:
      KAFKA_CLUSTERS_0_NAME: shop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9080:8080"
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  kafka_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
