# MySQL 8.0 — 1 instance, mỗi service 1 database + 1 user riêng.
# Lên K8s: thay bằng StatefulSet/operator hoặc managed DB; app chỉ đổi env SPRING_DATASOURCE_*.

services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      DB_PASSWORD_USER: ${DB_PASSWORD_USER}
      DB_PASSWORD_PRODUCT: ${DB_PASSWORD_PRODUCT}
      DB_PASSWORD_INVENTORY: ${DB_PASSWORD_INVENTORY}
      DB_PASSWORD_ORDER: ${DB_PASSWORD_ORDER}
      DB_PASSWORD_PAYMENT: ${DB_PASSWORD_PAYMENT}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION}
      DB_PASSWORD_KEYCLOAK: ${DB_PASSWORD_KEYCLOAK}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Tổng Hikari pool của mọi replica phải < giá trị này
      - --max_connections=300
      - --innodb_buffer_pool_size=256M
    volumes:
      - mysql_data:/var/lib/mysql
      # Chỉ chạy lần đầu (volume rỗng). Đổi script → phải xóa volume.
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  mysql_data:
