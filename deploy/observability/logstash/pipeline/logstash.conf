# Filebeat (log container) → parse JSON log của Spring Boot → Elasticsearch
#
# App log JSON (LogstashEncoder) ra stdout, mỗi dòng 1 object:
#   {"@timestamp":..., "level":"INFO", "logger_name":..., "message":..., "traceId":..., "spanId":..., "app_name":...}

input {
  beats { port => 5044 }
}

filter {
  # Tên service = tên service trong compose (ổn định khi scale nhiều replica)
  mutate {
    rename => { "[container][labels][com_docker_compose_service]" => "service" }
    rename => { "[container][name]" => "instance" }
  }

  if [message] =~ /^\{.*\}\s*$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
      remove_field => ["@version"]
    }
  } else {
    # Log không phải JSON (stacktrace JVM lúc start, v.v.)
    mutate { add_field => { "level" => "UNKNOWN" } }
  }

  if [level] { mutate { uppercase => ["level"] } }

  mutate {
    remove_field => ["container", "host", "agent", "tags"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 1 index/ngày cho mọi service; lọc theo field "service" (tránh bùng số index)
    index => "shop-logs-%{+YYYY.MM.dd}"
  }
}
