# Cấu hình Spring Kafka mặc định cho mọi service (docs/05-MESSAGING.md §6).
# Nạp bởi ShopKafkaDefaultsEnvironmentPostProcessor với độ ưu tiên thấp nhất → service ghi đè được.
# Địa chỉ broker KHÔNG đặt ở đây: service tự khai báo (IDE: localhost:9092, Docker: env SPRING_KAFKA_BOOTSTRAP_SERVERS).

# Producer: chỉ chở String (envelope JSON), không JsonSerializer + __TypeId__
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
# Bắt buộc: delivery.timeout.ms >= linger.ms + request.timeout.ms. Mặc định request.timeout.ms = 30000
# → 30000 < 5 + 30000 → KafkaProducer từ chối khởi tạo (ConfigException). docs/05 §6 bản đầu dính lỗi này.
spring.kafka.producer.properties.request.timeout.ms=10000
# Broker chết: send() chờ metadata tối đa 10s rồi ném lỗi (mặc định 60s → relay treo lâu hơn lockAtMostFor)
spring.kafka.producer.properties.max.block.ms=10000

# Consumer: group = tên service, commit offset do container lo (ack-mode record)
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50

# Listener: commit sau khi listener trả về thành công. Quy tắc: replica x concurrency <= số partition
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:1}
