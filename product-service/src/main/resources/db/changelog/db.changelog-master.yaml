# Liquibase master changelog. Mỗi thay đổi schema = 1 file changeset mới, include vào đây.
# Không sửa changeset đã chạy (Liquibase lưu checksum trong bảng DATABASECHANGELOG).
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-category-product.yaml
  - include:
      file: db/changelog/changes/002-seed-dev.yaml
